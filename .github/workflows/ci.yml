# CI quality gates (F4-7, TESTING.md "Quality gates", PHASE-4-FOUNDATION exit criterion 2).
# Runs on every PR and on pushes to main. On GitHub Free private repos, required checks can't be
# enforced, so the working rule is: merge only when green (ADR-0011).
# Actions are pinned to commit SHAs (SECURITY.md "Supply chain"); Dependabot proposes bumps.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  quality:
    name: Lint, types, unit tests, audit, builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm vitest run --project unit
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit db/migrations."
            git status --porcelain -- db/migrations
            exit 1
          fi
      - name: Dependency audit
        run: pnpm audit
      - name: Next.js build
        run: pnpm build
      - name: OpenNext Cloudflare build
        run: pnpm cf:build
      - name: Worker bundle size (dry run, no deploy)
        run: pnpm exec wrangler deploy --dry-run --env staging

  integration:
    name: Integration tests (Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # throwaway CI-only credential
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Each test file creates and drops its own throwaway database on this server.
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations apply to a fresh Postgres 16
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      - name: Integration tests
        run: pnpm vitest run --project integration

  e2e:
    name: E2E + axe (Workers runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (builds the Worker and serves it with wrangler dev)
        run: pnpm test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history
      - name: Install gitleaks (checksum-verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .
