allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: true
  workerd: true

# Supply-chain caution: don't resolve versions published in the last 3 days.
minimumReleaseAge: 4320

# Patched transitive versions (pnpm audit, 22 Oct 2026).
overrides:
  "glob@>=9.0.0 <14.0.2": "^14.0.2" # GHSA-3g3m-2fjr-6pw4 (16 Nov; replaces the 10.5 pin for GHSA-5j98-mcp5-4vw2), via @opennextjs/cloudflare and @node-minify/core (build only)
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1" # GHSA-g3hv-75wg-m249 (16 Nov), via glob and @typescript-eslint/typescript-estree (build/lint only)
  "undici@>=7.0.0 <7.30.1": "^7.30.1" # GHSA-xjj6-f33q-929c, -4qv8-2p9j-2685, -f72v-6w45-q472 (24 Oct), via wrangler > miniflare
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0" # GHSA-27r3-jxmh-p828 (31 Oct), via @opennextjs/aws > express

# Reviewed audit exceptions: build/dev tooling only, never in the Worker bundle. Re-check on every bump.
auditConfig:
  ignoreGhsas:
    - GHSA-67mh-4wv8-2f99 # esbuild 0.18 dev-server CORS, via drizzle-kit > @esbuild-kit; we never run esbuild's server
    - GHSA-vfj7-8cjw-p6xm # braces ReDoS, via eslint-config-next (lint only); no patched release exists
