# Optional local Postgres 16 (CLAUDE.md: tests use PGlite by default; CI uses a Postgres 16 service).
#   docker compose up -d
#   DATABASE_URL=postgres://chai:chai@localhost:5432/chai_tapri   (scripts, drizzle-kit, `pg`)
# The wsproxy lets the Neon serverless driver (used at runtime, ADR-0010) talk to this local
# Postgres over WebSockets, the same way it talks to Neon. src/server/db/client.ts points the
# driver at it automatically when DATABASE_URL's host is localhost.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chai
      POSTGRES_PASSWORD: chai # local-only throwaway credential
      POSTGRES_DB: chai_tapri
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chai -d chai_tapri"]
      interval: 2s
      timeout: 3s
      retries: 20

  neon-wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: "postgres:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "true"
    ports:
      - "5433:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
